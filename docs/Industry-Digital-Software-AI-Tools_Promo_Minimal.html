<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Industry-Digital-Software-AI-Tools Promo (Minimal)</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #04050c; font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif; color: #e8eeff; }
  #root { width: 1600px; height: 900px; position: relative; overflow: hidden; text-align: center;
    background:
      radial-gradient(700px 380px at 50% 38%, rgba(110,90,255,.30), transparent 70%),
      radial-gradient(500px 300px at 15% 100%, rgba(0,220,255,.22), transparent 70%),
      radial-gradient(500px 300px at 88% 95%, rgba(255,60,190,.20), transparent 70%),
      #04050c; }
  .grid { position: absolute; left: -20%; right: -20%; bottom: -10px; height: 380px;
    background:
      linear-gradient(rgba(120,160,255,.28) 1px, transparent 1px) 0 0 / 70px 70px,
      linear-gradient(90deg, rgba(120,160,255,.28) 1px, transparent 1px) 0 0 / 70px 70px;
    transform: perspective(380px) rotateX(62deg); transform-origin: bottom;
    -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 90%); mask-image: linear-gradient(to top, #000 10%, transparent 90%); }
  .kicker { position: relative; margin-top: 96px; font-size: 18px; letter-spacing: 10px; color: #7f8fff; font-weight: 600; }
  h1 { position: relative; font-size: 80px; line-height: 176px; font-weight: 800; letter-spacing: 0; margin-top: 10px;
    background: linear-gradient(90deg, #3de6ff 0%, #8d7bff 50%, #ff5fd2 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 28px rgba(130,110,255,.65)); }
  .tag { position: relative; margin-top: 14px; font-size: 40px; font-weight: 300; letter-spacing: 1px; color: #f2f5ff; }
  .tag b { font-weight: 700; color: #fff; text-shadow: 0 0 16px rgba(120,200,255,.8); }
  .zh { position: relative; margin-top: 10px; font-size: 24px; color: #8d9cc9; letter-spacing: 4px; }

  .pipe { position: relative; width: 980px; height: 110px; margin: 56px auto 0; }
  .pipe .line { position: absolute; left: 60px; right: 60px; top: 28px; height: 3px; border-radius: 3px;
    background: linear-gradient(90deg, #3de6ff, #8d7bff, #ff5fd2); box-shadow: 0 0 16px #8d7bff, 0 0 34px rgba(141,123,255,.6); }
  .node { position: absolute; top: 0; width: 120px; margin-left: -60px; font-size: 18px; font-weight: 600; letter-spacing: 1px; color: #dfe7ff; }
  .node i { display: block; width: 58px; height: 58px; margin: 0 auto 12px; border-radius: 50%; background: #04050c;
    border: 3px solid var(--c); box-shadow: 0 0 18px var(--c), inset 0 0 14px var(--c); }
  .node i:after { content: ""; display: block; width: 18px; height: 18px; margin: 15px auto; border-radius: 50%; background: var(--c); box-shadow: 0 0 12px var(--c); }

  .hl { position: relative; display: flex; justify-content: center; gap: 0; margin-top: 44px; }
  .hl div { padding: 0 54px; font-size: 22px; font-weight: 600; letter-spacing: 1px; color: #fff; border-left: 1px solid rgba(160,180,255,.3); }
  .hl div:first-child { border-left: 0; }
  .hl small { display: block; font-size: 15px; font-weight: 400; color: #8d9cc9; margin-top: 4px; letter-spacing: 2px; }

  .apps { position: absolute; left: 0; right: 0; bottom: 34px; font-size: 16px; letter-spacing: 5px; color: #6f7eaa; text-transform: uppercase; }
  .apps span { margin: 0 14px; color: #8d7bff; }
</style>
</head>
<body>
<div id="root">
  <div class="grid"></div>
  <div class="kicker">MANUFACTURING &times; AI</div>
  <h1>Industry-Digital-Software-AI-Tools</h1>
  <div class="tag">Say it. <b>AI builds it.</b></div>
  <div class="zh">一句话 · AI 搞定制造软件自动化</div>

  <div class="pipe">
    <div class="line"></div>
    <div class="node" style="left:60px;--c:#3de6ff"><i></i>Prompt</div>
    <div class="node" style="left:353px;--c:#6fa0ff"><i></i>Skill</div>
    <div class="node" style="left:647px;--c:#b07bff"><i></i>Run</div>
    <div class="node" style="left:940px;--c:#ff5fd2"><i></i>Report</div>
  </div>

  <div class="hl">
    <div>5 Products, 1 Workflow<small>五大软件 一套流程</small></div>
    <div>Self-Learning<small>自学习 越用越准</small></div>
    <div>Safe by Design<small>安全可控</small></div>
  </div>

  <div class="apps">Tecnomatix <span>&bull;</span> NX <span>&bull;</span> Vismockup <span>&bull;</span> CATIA <span>&bull;</span> Excel / PPT</div>
</div>
</body>
</html>
